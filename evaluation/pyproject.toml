[project]
name = "rag-evaluation-jp"
version = "0.1.0"
description = "Empirical evaluation of threshold-based vector retrieval for Japanese technical documentation, using agent-kms as system under test."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Toshihiro Yamaguchi" }]

dependencies = [
    # agent-kms is installed separately (editable from ~/dev/tools/agent-kms).
    # We depend on it transitively but do not pin via PyPI since it is not yet
    # published. See README "Reproducing".
    "jupyterlab>=4.0",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "nbstripout>=0.7",   # strip notebook outputs before commit if desired
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Notebooks put the repo root on sys.path before importing src.
"notebooks/*.ipynb" = ["E402"]
