# Hand-authored evaluation queries for rag-evaluation-jp.
#
# Each gold entry is (source basename, exact H2 heading string) as recorded
# by agent-kms's `markdown_h2` chunker.  Headings preserve the
# `{#anchor}` / `{/*anchor*/}` suffixes — that's how they live in Qdrant
# payloads, so we use them verbatim here to keep equality matching simple.
#
# Authoring strategy: queries were written after browsing the 130 chunks
# actually present in the eval_corpus collection, so every gold heading
# is a real chunk that *could* be retrieved.  Queries deliberately span:
#   - direct keyword hits (q001-q010)
#   - paraphrased intent (q011-q022)
#   - cross-section / multi-relevant (q023-q028)
#   - adversarial "no good answer" (q029-q032) — these test empty_rate
#
# 32 queries total.

